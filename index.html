<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Chat</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="vendor/bootstrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="config.js"></script>
    <script src="js/constants.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/toast.js" defer></script>
    <script src="js/characterModal.js" defer></script>
    <script src="js/charactersModal.js" defer></script>
  </head>
  <body class="dark-theme">
    <audio id="audioPlayer" hidden></audio>
    <div class="app container">
      <header class="navbar">
        <div class="logo" onclick="toggleMessagesDisplay()"><img src="assets/images/logo.png" /> <span>Ch. Chat</span></div>
        <img class="avatar hidden" src="assets/images/default-avatar.jpg" />
        <button class="menu-btn" onclick="toggleMenuModal()">
          <i class="bi bi-list"></i>
        </button>
      </header>

      <div class="messages-container">
        <div class="messages-display"></div>
        <div class="message typing-indicator hidden">...</div>
        <div class="system-notice hidden"></div>
      </div>

      <div class="message-input">
        <textarea class="hide-scrollbar" placeholder="Type a message..." rows="1"></textarea>
        <button class="button" onclick="sendMessage()">Send</button>
        <button class="go-on-btn hidden" onclick="goOn()"><i class="bi bi-caret-right"></i></button>
      </div>

      <!-- Menu modal -->
      <div class="menu-modal list-modal modal hidden" onclick="toggleMenuModal()">
        <div class="container">
          <div class="modal-content" onclick="stopPropagation(event)">
            <button class="close" onclick="toggleMenuModal()">
              <i class="bi bi-x-lg"></i>
            </button>
            <div class="title">Menu</div>

            <div class="item-list hide-scrollbar">
              <label class="item" onclick="CharactersModal.open()">
                <i class="bi bi-heart"></i>
                <div class="label">
                  Characters
                  <span>Select a character</span>
                </div>
                <div class="arrow">›</div>
              </label>

              <label class="item">
                <i class="bi bi-person-circle"></i>
                <div class="label" onclick="changeUserName()">
                  Username
                  <span>Change your username</span>
                </div>
                <div class="arrow">›</div>
              </label>

              <label class="item">
                <i class="bi bi-file-earmark"></i>
                <div class="label">
                  Model
                  <select class="model-select" onchange="changeModel(this.value)">
                    <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                    <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                  </select>
                </div>
              </label>

              <label class="item hidden">
                <i class="bi bi-moon"></i>
                <div class="label">
                  Dark theme
                  <span class="theme-desc" id="themeText"> Enabled </span>
                </div>
                <label class="toggle">
                  <input class="theme-checkbox" type="checkbox" onchange="toggleTheme()" />
                  <span class="slider"></span>
                </label>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Character modal -->
      <div class="modal character-modal hidden">
        <div class="modal-content" onclick="stopPropagation(event)">
          <button class="close" onclick="FolderModal.close()">
            <i class="bi bi-x-lg"></i>
          </button>
          <div class="title">Edit Character</div>

          <div class="modal-body hide-scrollbar">
            <label class="image-input">
              Image
              <img src="assets/images/default-avatar.jpg" />
              <input type="file" accept="image/*" hidden />
            </label>

            <label class="name-input">
              Name
              <input type="text" placeholder="Enter character name" />
            </label>

            <label class="gender-input">
              Gender
              <select>
                <option value="">Select gender</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="non-binary">Non-binary</option>
                <option value="other">Other</option>
              </select>
            </label>

            <label class="intro-input">
              Intro
              <textarea class="intro-input" placeholder="Short tagline or summary..."></textarea>
            </label>

            <label class="greeting-input">
              Greeting
              <textarea placeholder="First message from character..."></textarea>
            </label>

            <label class="background-input">
              Background
              <textarea placeholder="Detailed history and traits..."></textarea>
            </label>
          </div>

          <div class="actions">
            <button class="button delete-btn">Delete</button>
            <button class="button submit-btn">Save</button>
          </div>
        </div>
      </div>

      <!-- Characters modal -->
      <div class="modal characters-modal hidden" onclick="CharactersModal.close()">
        <div class="modal-content" onclick="stopPropagation(event)">
          <button class="close" onclick="CharactersModal.close()">
            <i class="bi bi-x-lg"></i>
          </button>
          <div class="title">Characters</div>

          <div class="modal-body hide-scrollbar">
            <div class="items-grid"></div>
          </div>

          <div class="actions hidden">
            <button class="button">Create</button>
          </div>
        </div>
      </div>

      <div class="toast hidden"></div>
    </div>
  </body>
</html>
